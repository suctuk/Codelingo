  services:
    client:
      build:
        context: .
        dockerfile: docker/client.Dockerfile
      ports:
        - "3000:3000"
      environment:
        - REACT_APP_API_URL=http://server:3001
      depends_on:
        - server
  
    server:
      build:
        context: .
        dockerfile: docker/server.Dockerfile
      ports:
        - "3001:3001"
      environment:
        - NODE_ENV=production
        - DB_HOST=db
      depends_on:
        - db
        - redis
  
    db:
      image: mysql:8
      environment:
        - MYSQL_ROOT_PASSWORD=rootpassword
        - MYSQL_DATABASE=code_learning_platform
        - MYSQL_USER=user
        - MYSQL_PASSWORD=password
      volumes:
        - db_data:/var/lib/mysql
        - ./server/scripts/db-setup.sql:/docker-entrypoint-initdb.d/init.sql
  
    redis:
      image: redis:6-alpine
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
  
  volumes:
    db_data:
    redis_data: