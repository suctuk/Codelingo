version: '3.8'

services:
  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    depends_on:
      - server
    environment:
      REACT_APP_API_URL: http://server:3001
    ports:
      - "3000:3000"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: code_learning_platform
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ../server/scripts:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    # command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: code_learning_platform
      REDIS_HOST: redis
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: your_jwt_secret_key_here
    ports:
      - "3001:3001"
    volumes:
      - ../server/src:/usr/src/app/src
      - ../server/scripts:/usr/src/app/scripts

volumes:
  db_data:
  redis_data: